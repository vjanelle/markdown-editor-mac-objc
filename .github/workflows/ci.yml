name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve Swift package dependencies
        run: xcodebuild -resolvePackageDependencies -workspace Draftmark.xcworkspace -scheme Draftmark

      - name: Build
        run: make build

      - name: Test
        run: make test
